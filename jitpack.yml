before_install:
  # NeoForge's asset tooling requests a Java 21 toolchain even though BenchMod
  # itself builds and runs Gradle with Java 25.
  - sdk install java 21.0.2-open
  - sdk install java 25.0.2-open
  - sdk use java 25.0.2-open

install:
  # Minecraft 26.2's upstream reconstructed sources do not compile cleanly on
  # JitPack. Use ModDev's supported patched-binary path, matching CI and the
  # documented release-readiness command.
  - ./gradlew -PmodBenchBinaryArtifacts=true clean check verifyReleaseReadiness --no-daemon --max-workers=1 --stacktrace
