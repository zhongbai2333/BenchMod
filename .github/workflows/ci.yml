name: CI

on:
  push:
    branches: [main, "26.3"]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and publication preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run checks and publication preflight
        env:
          JITPACK: 'true'
          GROUP: com.github.zhongbai2333
          ARTIFACT: BenchMod
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: ./gradlew check verifyReleaseReadiness --configuration-cache --no-daemon --max-workers=1 -PmodBenchBinaryArtifacts=true --stacktrace

      - name: Publish current 26.3 adapters for the independent consumer
        run: >-
          ./gradlew
          :bench-api-core:publishToMavenLocal
          :bench-report-schema:publishToMavenLocal
          :bench-api-neoforge-26.3:publishToMavenLocal
          :bench-runtime-neoforge-26.3:publishToMavenLocal
          :bench-gradle-plugin:publishToMavenLocal
          --no-daemon --max-workers=1 -PmodBenchBinaryArtifacts=true --stacktrace

      - name: Verify current 26.3 consumer compilation and production isolation
        run: >-
          ./gradlew -p examples/simple-neoforge-mod-26.3
          compileBenchJava check --configuration-cache --no-daemon --max-workers=1 -PmodBenchBinaryArtifacts=true --stacktrace

      - name: Test strict graphics report comparison
        run: python3 -m unittest discover -s tools/tests -v

      - name: Compile isolated graphics migration assistant
        run: >-
          ./gradlew -p examples/graphics-migration-assistant
          compileBenchJava check -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          --configuration-cache --no-daemon --stacktrace

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  released-consumer:
    name: Verify released JitPack consumer contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Resolve and compile the external consumer
        env:
          # Keep this step independent from Maven Local and every Gradle cache used by
          # the source-publication preflight above. The runner context is available here.
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-jitpack-consumer
        run: >-
          ./gradlew -p examples/simple-neoforge-mod
          compileBenchJava
          dependencies --configuration benchRuntimeClasspath
          --refresh-dependencies
          --no-configuration-cache
          --no-daemon
          --stacktrace
