name: CI

on:
  push:
    branches: [main, "26.2"]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and publication preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run checks and publication preflight
        env:
          JITPACK: 'true'
          GROUP: com.github.zhongbai2333
          ARTIFACT: BenchMod
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: ./gradlew -PmodBenchBinaryArtifacts=true check verifyReleaseReadiness --configuration-cache --no-daemon --stacktrace

      - name: Test graphics comparison contract
        run: python3 -m unittest discover -s tools/tests -v

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  source-consumer:
    name: Verify 26.2 independent consumer contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Publish this branch for the independent consumer
        run: ./gradlew -PmodBenchBinaryArtifacts=true publishToMavenLocal --no-daemon --stacktrace

      - name: Resolve and compile the external consumer
        env:
          # Keep dependency resolution independent from the publication Gradle cache.
          # Maven Local intentionally contains only this branch on the fresh runner.
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-jitpack-consumer
        run: >-
          ./gradlew -p examples/simple-neoforge-mod -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          compileBenchJava
          dependencies --configuration benchRuntimeClasspath
          --refresh-dependencies
          --no-configuration-cache
          --no-daemon
          --stacktrace

      - name: Run independent dedicated-server smoke
        run: >-
          ./gradlew -p examples/simple-neoforge-mod
          -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          runBenchServer verifyBenchServerReport
          --configuration-cache --no-daemon --stacktrace

      - name: Compile isolated graphics migration consumer
        run: >-
          ./gradlew -p examples/graphics-migration-assistant
          -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          compileBenchJava check dependencies --configuration runtimeClasspath
          --configuration-cache --no-daemon --stacktrace
