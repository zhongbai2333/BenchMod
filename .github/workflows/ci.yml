name: CI

on:
  push:
    branches: ['1.21.1']
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and publication preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run checks and JitPack-coordinate publication preflight
        env:
          JITPACK: 'true'
          GROUP: com.github.zhongbai2333
          ARTIFACT: BenchMod
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: ./gradlew -PmodBenchBinaryArtifacts=true check verifyReleaseReadiness --configuration-cache --no-daemon --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  source-consumer:
    name: Verify 1.21.1 independent consumer and server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v6
      - name: Publish this branch for the independent consumer
        run: ./gradlew -PmodBenchBinaryArtifacts=true publishToMavenLocal --no-daemon --stacktrace
      - name: Verify independent consumer compilation and production isolation
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-source-consumer
        run: >-
          ./gradlew -p examples/simple-neoforge-mod
          -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          compileBenchJava check sourcesJar dependencies --configuration runtimeClasspath
          --configuration-cache --no-daemon --stacktrace
      - name: Run independent dedicated-server smoke
        run: >-
          ./gradlew -p examples/simple-neoforge-mod
          -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          runBenchServer verifyBenchServerReport
          --configuration-cache --no-daemon --stacktrace
      - name: Verify repeated server run and configuration-cache reuse
        run: >-
          ./gradlew -p examples/simple-neoforge-mod
          -PmodBenchLocal=true -PmodBenchBinaryArtifacts=true
          runBenchServer verifyBenchServerReport
          --configuration-cache --no-daemon --stacktrace
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-consumer-evidence
          path: |
            examples/simple-neoforge-mod/build/modBench/raw-results/**
            examples/simple-neoforge-mod/build/modBench/runs/**/logs/**
            examples/simple-neoforge-mod/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
